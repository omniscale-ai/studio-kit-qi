# Constructor Studio QI Kit — Declarative Installation Manifest
# Schema: kit-manifest.schema.json v1.0

[manifest]
version = "1.0"
root = "{cf-studio-path}/config/kits/{slug}"
user_modifiable = true

# ── CLAIM artifact files ─────────────────────────────────────────────

[[resources]]
id = "claim_template"
description = "CLAIM artifact template"
source = "artifacts/CLAIM/template.md"
default_path = "artifacts/CLAIM/template.md"
type = "file"
user_modifiable = true

[[resources]]
id = "claim_rules"
description = "CLAIM validation rules"
source = "artifacts/CLAIM/rules.md"
default_path = "artifacts/CLAIM/rules.md"
type = "file"
user_modifiable = true

[[resources]]
id = "claim_checklist"
description = "CLAIM review checklist"
source = "artifacts/CLAIM/checklist.md"
default_path = "artifacts/CLAIM/checklist.md"
type = "file"
user_modifiable = true

[[resources]]
id = "claim_example"
description = "CLAIM example artifact (EJM triangle nonlocality)"
source = "artifacts/CLAIM/examples/example-ejm.md"
default_path = "artifacts/CLAIM/examples/example-ejm.md"
type = "file"
user_modifiable = true

# ── CERTIFICATE artifact files ───────────────────────────────────────

[[resources]]
id = "certificate_template"
description = "CERTIFICATE artifact template"
source = "artifacts/CERTIFICATE/template.md"
default_path = "artifacts/CERTIFICATE/template.md"
type = "file"
user_modifiable = true

[[resources]]
id = "certificate_rules"
description = "CERTIFICATE validation rules"
source = "artifacts/CERTIFICATE/rules.md"
default_path = "artifacts/CERTIFICATE/rules.md"
type = "file"
user_modifiable = true

[[resources]]
id = "certificate_checklist"
description = "CERTIFICATE review checklist"
source = "artifacts/CERTIFICATE/checklist.md"
default_path = "artifacts/CERTIFICATE/checklist.md"
type = "file"
user_modifiable = true

[[resources]]
id = "certificate_example"
description = "CERTIFICATE example artifact (EJM 2x2x4 Farkas certificate)"
source = "artifacts/CERTIFICATE/examples/example-ejm.md"
default_path = "artifacts/CERTIFICATE/examples/example-ejm.md"
type = "file"
user_modifiable = true

# ── CHECK-RUN artifact files ─────────────────────────────────────────

[[resources]]
id = "check_run_template"
description = "CHECK-RUN artifact template"
source = "artifacts/CHECK-RUN/template.md"
default_path = "artifacts/CHECK-RUN/template.md"
type = "file"
user_modifiable = true

[[resources]]
id = "check_run_rules"
description = "CHECK-RUN validation rules"
source = "artifacts/CHECK-RUN/rules.md"
default_path = "artifacts/CHECK-RUN/rules.md"
type = "file"
user_modifiable = true

[[resources]]
id = "check_run_checklist"
description = "CHECK-RUN review checklist"
source = "artifacts/CHECK-RUN/checklist.md"
default_path = "artifacts/CHECK-RUN/checklist.md"
type = "file"
user_modifiable = true

[[resources]]
id = "check_run_example"
description = "CHECK-RUN example artifact (EJM certificate reproduction, macOS/arm64)"
source = "artifacts/CHECK-RUN/examples/example-ejm-macos.md"
default_path = "artifacts/CHECK-RUN/examples/example-ejm-macos.md"
type = "file"
user_modifiable = true

# ── Validation constraints ───────────────────────────────────────────

[[resources]]
id = "constraints"
description = "Deterministic validation constraints for QI kit artifact kinds"
source = "constraints.toml"
default_path = "constraints.toml"
type = "file"
user_modifiable = true

# ── THEOREM / PROOF-MAP / LEMMA artifact files (theorem layer) ───────

[[resources]]
id = "theorem_template"
description = "THEOREM artifact template"
source = "artifacts/THEOREM/template.md"
default_path = "artifacts/THEOREM/template.md"
type = "file"
user_modifiable = true

[[resources]]
id = "proof_map_template"
description = "PROOF-MAP artifact template"
source = "artifacts/PROOF-MAP/template.md"
default_path = "artifacts/PROOF-MAP/template.md"
type = "file"
user_modifiable = true

[[resources]]
id = "lemma_template"
description = "LEMMA artifact template"
source = "artifacts/LEMMA/template.md"
default_path = "artifacts/LEMMA/template.md"
type = "file"
user_modifiable = true

# ── Scripts (computational gates) ────────────────────────────────────

[[resources]]
id = "graph_gate"
description = "Cross-artifact semantic gate (status consistency, load-bearing resolution)"
source = "scripts/graph_gate.py"
default_path = "scripts/graph_gate.py"
type = "file"
user_modifiable = false

# ── Workflows ────────────────────────────────────────────────────────

[[resources]]
id = "wf_verify_certificate"
description = "Workflow: run checker, record CHECK-RUN, update statuses"
source = "workflows/verify-certificate.md"
default_path = "workflows/verify-certificate.md"
type = "file"
user_modifiable = true

[[resources]]
id = "wf_decompose_proof"
description = "Workflow: build THEOREM/PROOF-MAP/LEMMA claim graph from a paper"
source = "workflows/decompose-proof.md"
default_path = "workflows/decompose-proof.md"
type = "file"
user_modifiable = true

[[resources]]
id = "wf_hunt_counterexample"
description = "Workflow: certificate-producing search over finite model classes"
source = "workflows/hunt-counterexample.md"
default_path = "workflows/hunt-counterexample.md"
type = "file"
user_modifiable = true

[[resources]]
id = "wf_audit_references"
description = "Workflow: resolve and statement-check all cited nodes"
source = "workflows/audit-references.md"
default_path = "workflows/audit-references.md"
type = "file"
user_modifiable = true
