# Constructor Studio canonical kit manifest for studio-kit-qi (Constructor Studio Theorem Kit).
# Resource ids double as template variables inside rules files and AGENTS.md: {principles}, {conjecture_template}, {attest_lean}, ...
# Keep the `constraints` resource LAST: the [kits.resources.artifacts.<KIND>] bindings below attach to it.
# Regenerate with the generator kept next to the kit maintainer's notes rather than editing by hand when adding example files.

