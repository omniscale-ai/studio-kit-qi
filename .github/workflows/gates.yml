name: gates
on: [push, pull_request]
jobs:
  graph-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cross-artifact semantic gate
        run: python3 scripts/graph_gate.py artifacts
